name: ReVector Admin Verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Separate operations browser regression
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -1)"
          CHROMIUM_PATH="$CHROME" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-qa
          path: test-results/
